# ==========================================
# Inventaire Ansible - Infrastructure Nexus360
# ==========================================

[all:vars]
ansible_python_interpreter=/usr/bin/python3
domain_name=nexus360.local
dns_primary=10.36.10.10
ntp_server=10.36.10.10

# --- Passerelles & Routeurs Subnet ---
[gateways]
nx-gw-dc01    ansible_host=10.36.10.1 site=datacenter subnet="10.36.10.0/24"
nx-gw-prod01  ansible_host=10.36.20.1 site=usine      subnet="10.36.20.0/24"
nx-gw-nord01  ansible_host=10.36.30.1 site=nord       subnet="10.36.30.0/24"
nx-gw-sud01   ansible_host=10.36.40.1 site=sud        subnet="10.36.40.0/24"

# --- Serveurs Web & Applicatifs ---
[webservers]
nx-web-srv01  ansible_host=10.36.30.20 site=nord app_env=production

# --- Serveurs Opérations & CI/CD ---
[ops_servers]
nx-ops-srv01  ansible_host=10.36.10.20 site=datacenter backup_retention_days=30

# --- Nœuds de Supervision ---
[monitoring]
nx-mon-srv01  ansible_host=10.36.10.30 site=datacenter prometheus_port=9090 grafana_port=3000

# --- Contrôleurs Windows (Accès WinRM / PowerShell) ---
[windows]
nx-ad-dc01    ansible_host=10.36.10.10 site=datacenter
nx-ad-rodc01  ansible_host=10.36.20.10 site=usine
nx-fs-nord01  ansible_host=10.36.30.15 site=nord
nx-fs-sud01   ansible_host=10.36.40.15 site=sud

[windows:vars]
ansible_connection=winrm
ansible_winrm_server_cert_validation=ignore
ansible_port=5986

# --- Groupes Globaux ---
[linux:children]
gateways
webservers
ops_servers
monitoring

[production:children]
linux
windows
