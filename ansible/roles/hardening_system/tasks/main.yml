---
# ==============================================================================
# Tasks for role hardening_system (ANSSI / CIS Level 2 - Exigence B5)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Hardening Kernel Sysctl (/etc/sysctl.d/99-security.conf)
# ------------------------------------------------------------------------------
- name: "Déployer la configuration de durcissement sysctl /etc/sysctl.d/99-security.conf"
  ansible.builtin.template:
    src: 99-security.conf.j2
    dest: "{{ sysctl_security_conf }}"
    owner: root
    group: root
    mode: '0644'
  notify: Apply sysctl

- name: "Appliquer immédiatement les paramètres sysctl"
  ansible.builtin.command:
    cmd: /usr/sbin/sysctl --system
  changed_when: false

# ------------------------------------------------------------------------------
# 2. SELinux en mode Enforcing (Rocky Linux / RedHat)
# ------------------------------------------------------------------------------
- name: "Configurer SELinux en mode Enforcing dans /etc/selinux/config"
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: 'SELINUX=enforcing'
    state: present
  when: ansible_os_family == "RedHat"

- name: "Configurer le type SELinux sur targeted"
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUXTYPE='
    line: 'SELINUXTYPE=targeted'
    state: present
  when: ansible_os_family == "RedHat"

- name: "Activer immédiatement SELinux en mode Enforcing au runtime"
  ansible.builtin.command:
    cmd: /usr/sbin/setenforce 1
  failed_when: false
  changed_when: false
  when: ansible_os_family == "RedHat"

# ------------------------------------------------------------------------------
# 3. Durcissement Pare-feu Restrictif (Firewalld sur Rocky Linux)
# ------------------------------------------------------------------------------
- name: "Installer firewalld sur les hôtes Rocky Linux / RedHat"
  ansible.builtin.package:
    name: firewalld
    state: present
  when: ansible_os_family == "RedHat"

- name: "Démarrer et activer le service firewalld"
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: ansible_os_family == "RedHat"

- name: "Supprimer l'accès SSH global ouvert à tout le réseau dans firewalld"
  ansible.posix.firewalld:
    service: ssh
    zone: public
    permanent: true
    state: absent
    immediate: true
  when: ansible_os_family == "RedHat"
  ignore_errors: true

- name: "Restreindre l'accès SSH au bastion uniquement via rich-rules firewalld"
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ item }}" service name="ssh" accept'
    zone: public
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ bastion_subnets }}"
  when: ansible_os_family == "RedHat"

- name: "Autoriser le service Web HTTP (port 80) pour les serveurs Web dans firewalld"
  ansible.posix.firewalld:
    service: http
    zone: public
    permanent: true
    state: enabled
    immediate: true
  when:
    - ansible_os_family == "RedHat"
    - (inventory_hostname in groups['webservers'] | default([])) or (allow_business_http | bool) or (inventory_hostname == 'LNX-WEB01')

- name: "Autoriser le service Web HTTPS (port 443) pour les serveurs Web dans firewalld"
  ansible.posix.firewalld:
    service: https
    zone: public
    permanent: true
    state: enabled
    immediate: true
  when:
    - ansible_os_family == "RedHat"
    - (inventory_hostname in groups['webservers'] | default([])) or (allow_business_http | bool) or (inventory_hostname == 'LNX-WEB01')

- name: "Autoriser le flux SMB (port 445/tcp) sur les partages métiers si requis"
  ansible.posix.firewalld:
    port: "445/tcp"
    zone: public
    permanent: true
    state: enabled
    immediate: true
  when:
    - ansible_os_family == "RedHat"
    - allow_business_smb | bool

- name: "Autoriser le port Tailscale WireGuard (41641/udp) sur la passerelle LNXGW01"
  ansible.posix.firewalld:
    port: "41641/udp"
    zone: public
    permanent: true
    state: enabled
    immediate: true
  when:
    - ansible_os_family == "RedHat"
    - (inventory_hostname in groups['gateways'] | default([])) or (inventory_hostname == 'LNXGW01')

# ------------------------------------------------------------------------------
# 4. Compatibilité Pare-feu UFW (Debian / Ubuntu)
# ------------------------------------------------------------------------------
- name: "Configurer la politique UFW par défaut (Default Deny incoming)"
  community.general.ufw:
    direction: incoming
    default: deny
  when: ansible_os_family == "Debian"

- name: "Autoriser SSH depuis le bastion uniquement dans UFW"
  community.general.ufw:
    rule: allow
    proto: tcp
    port: '22'
    from_ip: "{{ item }}"
  loop: "{{ bastion_subnets }}"
  when: ansible_os_family == "Debian"

- name: "Autoriser HTTP et HTTPS sur serveurs web Debian"
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ item }}"
  loop:
    - "80"
    - "443"
  when:
    - ansible_os_family == "Debian"
    - (inventory_hostname in groups['webservers'] | default([])) or (inventory_hostname == 'LNX-WEB01')
